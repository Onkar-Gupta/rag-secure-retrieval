# Paths
users_file: eval/users.yaml   # demo users with placeholder keys; use your own file and strong keys
docs_dir: data/docs
chroma_dir: chroma
db_path: rag.sqlite

# Chunking. FROZEN 4 Nov 2026 from the dev split (reports/tuning_dev.json). See protocol Amendments.
chunk_size: 300
chunk_overlap: 100
min_page_chars: 20   # a PDF page with less text than this is reported (probably scanned: run OCR first)

# Retrieval. top_k is fixed by the protocol; the threshold was chosen on the dev split and is FROZEN.
top_k: 5
relevance_threshold: 0.6079088449478149
search_floor_ms: 20   # every search takes at least this long, so timing does not show what other groups hold. Raise it for a larger index.

# Answering. One MIT-licensed model chosen by the owner (protocol Amendments, 4 Nov 2026).
not_found_response: "I could not find an answer in the documents you can access."
ollama_url: http://localhost:11434
model: phi4-mini:3.8b
temperature: 0
seed: 0
max_tokens: 300
max_question_chars: 500

# Service
host: 127.0.0.1          # bind to this machine only; change deliberately to expose it
port: 8000
api_key_header: X-API-Key
admin_users: [admin]     # may call POST /ingest
log_question_text: false # false: the query log keeps only a hash of each question

# Demo mode: visitors get a private session, upload files into it and ask about them. Off by default.
demo_mode: false
demo_max_file_mb: 5
demo_max_files: 3        # per session
demo_max_sessions: 20    # at once
demo_ttl_seconds: 3600   # a session and its files are deleted after this
