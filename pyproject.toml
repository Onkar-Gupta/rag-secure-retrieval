[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-secure-retrieval"
dynamic = ["version"]
description = "Local RAG with per-document access groups and a measured leakage test."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Onkar Gupta" }]
keywords = ["rag", "retrieval-augmented-generation", "llm-security"]
dependencies = ["PyYAML==6.*", "chromadb==1.5.9", "pypdf==6.21.4", "fastapi==0.162.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["pytest==9.*", "ruff==0.*", "httpx==0.28.1"]

[project.scripts]
rag = "rag_secure.cli:main"

[tool.setuptools.dynamic]
version = { attr = "rag_secure.__version__" }

[tool.setuptools]
packages = ["rag_secure"]

[tool.setuptools.package-data]
rag_secure = ["ui/*", "ui/fonts/*", "ui/img/*"]
